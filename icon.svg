<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa8ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- fan of cards -->
  <rect x="20" y="44" width="60" height="60" rx="10"
        fill="#1a1d24" stroke="url(#g4)" stroke-width="2"
        transform="rotate(-12 50 74)"/>
  <rect x="28" y="40" width="60" height="60" rx="10"
        fill="#14161c" stroke="url(#g4)" stroke-width="2"
        transform="rotate(-6 58 70)"/>

  <!-- main panel -->
  <rect x="36" y="36" width="60" height="60" rx="12"
        fill="#0b0c0f" stroke="url(#g4)" stroke-width="2.5"/>

  <!-- ⌘ glyph -->
  <g fill="none" stroke="url(#g4)" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="50" y="50" width="32" height="32" rx="4"/>
    <rect x="42" y="42" width="12" height="12" rx="3"/>
    <rect x="42" y="78" width="12" height="12" rx="3"/>
    <rect x="78" y="42" width="12" height="12" rx="3"/>
    <rect x="78" y="78" width="12" height="12" rx="3"/>
  </g>
</svg>
